[package]
name = "owa-studio"
version = "6.27.4"
description = "West - Tu espacio de estudio"
authors = ["Gewodev"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
# HTTP nativo (sin CORS); unsafe-headers permite enviar Authorization
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
zip = "2"
base64 = "0.22"
sha2 = "0.10"
libloading = "0.8"
dunce = "1"
httpdate = "1"
tokio = { version = "1", features = ["time", "rt-multi-thread", "net", "sync", "macros"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "=2.12.0"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "=0.7.3"
webview2-com = "0.38.2"
windows-core = "0.61"
windows = { version = "0.61", features = ["Foundation", "Media", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_System_Registry"] }

[profile.release]
panic = "abort" # Strip fatal error messages for smaller binary
codegen-units = 1 # Optimize for size
lto = true # Enable Link Time Optimization
opt-level = "s" # Optimize for binary size
strip = true # Strip symbols from binary
