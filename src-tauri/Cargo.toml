[package]
name = "owa-studio"
version = "6.22.0"
description = "A premium study workspace"
authors = ["Gewodev"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
# HTTP nativo (sin CORS); unsafe-headers permite enviar Authorization
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
zip = "2"
tokio = { version = "1", features = ["time", "rt-multi-thread", "net", "sync", "macros"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows-core = "0.61"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Security_Credentials"] }

[profile.release]
panic = "abort" # Strip fatal error messages for smaller binary
codegen-units = 1 # Optimize for size
lto = true # Enable Link Time Optimization
opt-level = "s" # Optimize for binary size
strip = true # Strip symbols from binary
