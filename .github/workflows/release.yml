name: West Release

# Publica una version de West en GitHub Releases y deja listo el manifiesto
# `latest.json` que la app consulta para ofrecer "Actualizar" dentro de si.
#
# Flujo recomendado:
#   1. Sube los cambios a `main`.
#   2. Ejecuta este workflow manualmente (Actions -> West Release -> Run) o
#      crea la etiqueta `v6.27.2` y subela.
#   3. Cuando la app este abierta, aparecera el aviso "Actualizar".

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publicar (por ejemplo 6.27.2)'
        required: true
        type: string
      publish:
        description: 'Publicar el release inmediatamente (sin dejar en borrador)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Compilar y publicar West
    runs-on: windows-latest
    steps:
      - name: Repositorio
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Dependencias
        run: pnpm install --frozen-lockfile

      - name: Determinar version
        id: version
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $raw = ''
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $raw = $env:GITHUB_REF.Substring('refs/tags/v'.Length) }
          if ($env:RELEASE_VERSION) { $raw = $env:RELEASE_VERSION }
          $version = if ($raw) { $raw.Trim() } else { $config.version }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Fijar la version en los manifiestos
        shell: pwsh
        run: ./scripts/set-release-version.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Comprobar tipos
        run: pnpm exec tsc --noEmit

      - name: Compilar, firmar y publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # La clave PRIVADA solo existe en los secretos del repositorio: nunca
          # se versiona ni viaja dentro de la app. La clave PUBLICA si va dentro
          # del instalador (src-tauri/tauri.conf.json -> bundle.updater.pubkey).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: 'West ${{ steps.version.outputs.version }}'
          releaseBody: |
            West ${{ steps.version.outputs.version }}.

            La app comprueba este release al arrancar y ofrece "Actualizar"
            dentro de la propia aplicacion. Los datos del usuario (notas,
            cursos, musica y actividad) se conservan durante la actualizacion.
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.prod.conf.json --config src-tauri/tauri.ci.conf.json --bundles nsis
