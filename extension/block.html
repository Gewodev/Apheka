<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Bloqueado — OWA Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #020203; color: #EAEAEA;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      padding: 24px;
    }
    .wrap { max-width: 440px; width: 100%; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 56px; }
    .brand img { width: 30px; height: 30px; border-radius: 8px; display: block; }
    .brand .name { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; color: #EAEAEA; }
    .brand .name span { color: #E11D48; }
    .brand .tag { font-size: 8.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #555; font-weight: 600; margin-top: 1px; }
    h1 { font-family: 'Inter Tight', 'Inter', sans-serif; font-size: 34px; font-weight: 300; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 14px; }
    h1 b { font-weight: 700; }
    p { font-size: 13px; color: #8a8a90; line-height: 1.7; max-width: 380px; }
    p b { color: #c9c9ce; font-weight: 600; }
    .card { margin-top: 30px; border: 1px solid #1e1e22; background: #0b0c0f; border-radius: 14px; padding: 18px 20px; display: flex; align-items: center; gap: 14px; }
    .card .d { flex: 1; min-width: 0; }
    .card .domain { font-family: 'JetBrains Mono', monospace; font-size: 13.5px; font-weight: 600; color: #EAEAEA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card .range { font-size: 10px; color: #77777d; font-weight: 500; margin-top: 3px; letter-spacing: 0.04em; }
    .card .until { text-align: right; flex-shrink: 0; }
    .card .until .n { font-family: 'JetBrains Mono', monospace; font-size: 19px; font-weight: 700; color: #E11D48; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .card .until .l { font-size: 8.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #55555b; font-weight: 600; margin-top: 2px; }
    .foot { margin-top: 46px; font-size: 9.5px; color: #4a4a50; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="icons/icon48.png" alt="OWA Studio" />
      <div>
        <div class="name">OWA <span>Studio</span></div>
        <div class="tag">Ventanas · Enfoque</div>
      </div>
    </div>
    <h1>Sitio <b>bloqueado</b></h1>
    <p id="msg">Decidiste protegerte de este sitio durante tu horario de bloqueo. Volverá a estar disponible cuando termine.</p>
    <div class="card">
      <div class="d">
        <div class="domain" id="domain">—</div>
        <div class="range" id="range">Bloqueo activo</div>
      </div>
      <div class="until">
        <div class="n" id="mins">—</div>
        <div class="l">restante</div>
      </div>
    </div>
    <div class="foot">Protege tu atención</div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const d = params.get('d');
    const to = params.get('to');
    if (d) {
      document.getElementById('domain').textContent = decodeURIComponent(d);
      document.getElementById('msg').innerHTML = 'Decidiste protegerte de <b>' + decodeURIComponent(d).replace(/</g, '&lt;') + '</b> durante tu horario de bloqueo. Volverá a estar disponible cuando termine.';
    }
    function tick() {
      const n = document.getElementById('mins');
      const r = document.getElementById('range');
      if (to) r.textContent = 'Hasta las ' + to;
      if (!to) { n.textContent = '—'; return; }
      const [h, m] = to.split(':').map(Number);
      const now = new Date();
      const end = new Date(); end.setHours(h, m, 0, 0);
      if (end <= now) end.setDate(end.getDate() + 1);
      const mins = Math.max(0, Math.round((end - now) / 60000));
      n.textContent = mins >= 60 ? Math.floor(mins / 60) + 'h ' + String(mins % 60).padStart(2, '0') + 'm' : mins + ' min';
    }
    tick(); setInterval(tick, 30000);
  </script>
</body>
</html>
